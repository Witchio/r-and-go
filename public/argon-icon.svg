<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="randgo-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#26334F" />
      <stop offset="100%" stop-color="#162038" />
    </linearGradient>
    <linearGradient id="randgo-accent" x1="38" y1="12" x2="54" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B8CF8" />
      <stop offset="100%" stop-color="#6266DC" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#randgo-bg)" />
  <rect x="3" y="3" width="58" height="58" rx="14" stroke="#7075E4" stroke-opacity="0.28" stroke-width="2" />

  <!-- Subtle Route Path Arc connecting top origin node to the 'R & Go.' destination dot -->
  <path
    d="M24.5 16H36.5C43.4036 16 49 21.5964 49 28.5V35"
    stroke="url(#randgo-accent)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-dasharray="4 5"
    opacity="0.9"
  />

  <!-- Origin Waypoint Node (Top-Left) -->
  <circle cx="16.5" cy="16" r="4" fill="#1D2842" stroke="#8B8CF8" stroke-width="2.75" />

  <!-- Geometric Bold 'R' for R & Go -->
  <path
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M14 23H26.8C32.8 23 36.8 26.3 36.8 31.3C36.8 35.1 34.4 37.9 30.6 38.9L37.4 51H30.1L24.1 39.6H20.4V51H14V23ZM20.4 28.3V34.6H26.2C28.9 34.6 30.4 33.4 30.4 31.4C30.4 29.5 28.9 28.3 26.2 28.3H20.4Z"
    fill="#FFFFFF"
  />

  <!-- Signature 'R & Go.' Destination Pin / Node -->
  <circle cx="49" cy="45.5" r="6.5" fill="url(#randgo-accent)" />
  <circle cx="49" cy="45.5" r="2.5" fill="#FFFFFF" />
</svg>
