<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="argon-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#26334F" />
      <stop offset="100%" stop-color="#162038" />
    </linearGradient>
    <linearGradient id="argon-accent" x1="38" y1="12" x2="54" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B8CF8" />
      <stop offset="100%" stop-color="#6266DC" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#argon-bg)" />
  <rect x="3" y="3" width="58" height="58" rx="14" stroke="#7075E4" stroke-opacity="0.28" stroke-width="2" />

  <!-- Subtle Route Path Arc connecting top calendar node to the 'a.' destination dot -->
  <path
    d="M24.5 16H36.5C43.4036 16 49 21.5964 49 28.5V35"
    stroke="url(#argon-accent)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-dasharray="4 5"
    opacity="0.9"
  />

  <!-- Origin Waypoint Node (Top-Left) -->
  <circle cx="16.5" cy="16" r="4" fill="#1D2842" stroke="#8B8CF8" stroke-width="2.75" />

  <!-- Geometric lowercase 'a' -->
  <path
    d="M25.5 24.5C20.2 24.5 16.2 27.1 15.2 30.8L21.1 32.3C21.7 30.3 23.3 29.4 25.6 29.4C28.5 29.4 30.2 31.0 30.2 33.4V34.2L23.8 34.9C17.2 35.6 13.5 38.6 13.5 43.4C13.5 48.1 17.3 51.2 22.6 51.2C26.2 51.2 28.9 49.7 30.4 47.4V50.5H36.8V33.3C36.8 27.6 32.4 24.5 25.5 24.5ZM24.4 46.3C21.8 46.3 20.1 45.0 20.1 43.1C20.1 41.0 21.8 39.7 25.0 39.3L30.2 38.7V40.8C30.2 44.1 27.7 46.3 24.4 46.3Z"
    fill="#FFFFFF"
  />

  <!-- Signature Argon '.' Destination Pin / Node -->
  <circle cx="49" cy="45.5" r="6.5" fill="url(#argon-accent)" />
  <circle cx="49" cy="45.5" r="2.5" fill="#FFFFFF" />
</svg>
